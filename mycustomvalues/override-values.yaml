controller:
  serviceType: LoadBalancer
  JCasC:
    configScripts:
      create-job: |
        jobs:

          - script: |
              
              pipelineJob('seedjob(masterjob)-from-helm') {
                description('Pipeline for jenkinspipeline repository')

                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/anandambitionv2/Jobs-repo.git')

                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('JenkinsFile')
                    lightweight()
                  }
                }
              }
          - script: |
              pipelineJob('terraformjob-from-jcasc-HELM') {
                description('Pipeline for jenkins-pipelines-v2 repository')

                definition {
                  cpsScm {
                    scm {
                      git {
                        remote {
                          url('https://github.com/anandambitionv2/jenkins-pipelines-v2.git')
                        }
                        branch('*/main')
                      }
                    }
                    scriptPath('JenkinsFile')
                    lightweight()
                  }
                }
              }

agent:
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"

additionalAgents:
  terraform:
    podName: mycustomtf
    customJenkinsLabels: mycustomtf
    sideContainerName: mycustomtf-sidecar
    image:
      repository: hashicorp/terraform
      tag: "1.13.3"
    command: "/bin/sh -c"
    args: "cat"
    TTYEnabled: true