
jobs:
  - script: |
      pipelineJob('terraformjob-from-jcasc') {
        description('Pipeline for jenkins-pipelines-v2 repository')

        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/anandambitionv2/jenkins-pipelines-v2.git')
                }
                branch('*/main')
              }
            }
            scriptPath('JenkinsFile')
            lightweight()
          }
        }
      }
